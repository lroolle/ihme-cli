name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=3m

      - run: go vet ./...
      - run: go test ./... -cover
      - run: go build -o ihme ./cmd/ihme
      - run: ./ihme version
      - run: ./ihme --help
