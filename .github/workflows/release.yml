name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"

          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ihme-darwin-amd64 ./cmd/ihme
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ihme-darwin-arm64 ./cmd/ihme
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ihme-linux-amd64 ./cmd/ihme
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/ihme-linux-arm64 ./cmd/ihme
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/ihme-windows-amd64.exe ./cmd/ihme

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
