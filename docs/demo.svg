<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420">
  <style>
    .bg { fill: #1e1e2e; }
    .titlebar { fill: #313244; }
    .btn-r { fill: #f38ba8; }
    .btn-y { fill: #f9e2af; }
    .btn-g { fill: #a6e3a1; }
    .prompt { fill: #89b4fa; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .cmd { fill: #cdd6f4; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .dim { fill: #6c7086; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .green { fill: #a6e3a1; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .yellow { fill: #f9e2af; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .cyan { fill: #89dceb; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .white { fill: #cdd6f4; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
    .title { fill: #bac2de; font-family: 'SF Mono', monospace; font-size: 12px; text-anchor: middle; }
  </style>
  <rect class="bg" width="680" height="420" rx="10"/>
  <rect class="titlebar" width="680" height="32" rx="10 10 0 0"/>
  <circle class="btn-r" cx="20" cy="16" r="6"/>
  <circle class="btn-y" cx="38" cy="16" r="6"/>
  <circle class="btn-g" cx="56" cy="16" r="6"/>
  <text class="title" x="340" y="21">ihme — iCloud Hide My Email CLI</text>

  <text class="prompt" x="16" y="60">$</text>
  <text class="cmd" x="28" y="60">ihme new github.com</text>

  <text class="white" x="16" y="88">  [1] uploads_tease.6t@icloud.com</text>
  <text class="white" x="16" y="106">  [2] copay.jacket-4c@icloud.com</text>
  <text class="white" x="16" y="124">  [3] rotors.gutless.7q@icloud.com</text>

  <text class="dim" x="16" y="148">Select [1-3] or [c]ancel:</text>
  <text class="cyan" x="240" y="148">2</text>
  <text class="green" x="16" y="166">Reserved: copay.jacket-4c@icloud.com (label: github.com)</text>

  <text class="prompt" x="16" y="198">$</text>
  <text class="cmd" x="28" y="198">ihme list --search github --active</text>

  <text class="dim" x="16" y="222">ID        LABEL              ADDRESS                       STATUS</text>
  <text class="white" x="16" y="240">k27ghn78  github-new         rind_charges.3@icloud.com     active</text>
  <text class="white" x="16" y="258">a1b2c3d4  github.com         copay.jacket-4c@icloud.com    active</text>

  <text class="prompt" x="16" y="290">$</text>
  <text class="cmd" x="28" y="290">ihme view github.com --json --jq '.result.hme'</text>
  <text class="green" x="16" y="310">copay.jacket-4c@icloud.com</text>

  <text class="prompt" x="16" y="342">$</text>
  <text class="cmd" x="28" y="342">ihme list --json --jq '.count'</text>
  <text class="yellow" x="16" y="362">325</text>

  <text class="prompt" x="16" y="394">$</text>
  <text class="dim" x="28" y="394">_</text>
</svg>
